name: ci

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Prove zero third-party dependencies
        run: |
          if grep -qE '^\s*require' go.mod; then
            echo "go.mod contains a require block"; exit 1
          fi
          extra="$(go list -m all | tail -n +2)"
          if [ -n "$extra" ]; then
            echo "unexpected third-party modules:"; echo "$extra"; exit 1
          fi
          echo "OK: standard library only"

      - name: Build (static, cgo disabled)
        run: CGO_ENABLED=0 go build ./...

      - name: Cross-compile
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${t%/*}" GOARCH="${t#*/}" CGO_ENABLED=0 go build ./... || exit 1
            echo "OK $t"
          done

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Tests with race detector
        run: go test -race ./...

      - name: Verification suite (Linux fdatasync path)
        run: go run ./cli verify --cycles 100000

      - name: Negative control (verifier must have teeth)
        # Exits 0 only if removing a durability barrier makes the harness FAIL.
        run: go run ./cli torture --negative-control --cycles 500

      - name: Benchmark
        run: go run ./cli bench --keys 100000 --seq 2000 --reads 100000
