<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Anvil recovery time is constant"><rect width="900" height="330" fill="#F2EEE3"/><text x="28" y="38" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#6E6E6E" text-anchor="start" font-weight="normal">SCALING  ·  recovery is selection, not replay</text><text x="28" y="74" font-family="'Archivo Black','Arial Black',system-ui,sans-serif" font-size="30" fill="#0B0B0B" text-anchor="start" font-weight="normal">10x the data. Same recovery time.</text><rect x="28" y="88" width="844" height="4" fill="#0B0B0B"/><rect x="36" y="124" width="400" height="150" fill="#0B0B0B"/><rect x="28" y="116" width="400" height="150" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="4"/><text x="48" y="148" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" fill="#6E6E6E" text-anchor="start" font-weight="normal">10,000 KEYS · DEPTH 1</text><text x="48" y="208" font-family="'Archivo Black','Arial Black',system-ui,sans-serif" font-size="54" fill="#0B0B0B" text-anchor="start" font-weight="normal">34</text><text x="122" y="208" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="17" fill="#0B0B0B" text-anchor="start" font-weight="normal">us to reopen</text><text x="48" y="242" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#6E6E6E" text-anchor="start" font-weight="normal">read p50 5.9us   scan 21.3M keys/s   file 0.4MB</text><rect x="476" y="124" width="400" height="150" fill="#0B0B0B"/><rect x="468" y="116" width="400" height="150" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="4"/><text x="488" y="148" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" fill="#6E6E6E" text-anchor="start" font-weight="normal">100,000 KEYS · DEPTH 2</text><text x="488" y="208" font-family="'Archivo Black','Arial Black',system-ui,sans-serif" font-size="54" fill="#0B0B0B" text-anchor="start" font-weight="normal">34</text><text x="562" y="208" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="17" fill="#0B0B0B" text-anchor="start" font-weight="normal">us to reopen</text><text x="488" y="242" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#6E6E6E" text-anchor="start" font-weight="normal">read p50 9.1us   scan 20.0M keys/s   file 4.2MB</text><rect x="28" y="286" width="844" height="30" fill="#B8FF3C" stroke="#0B0B0B" stroke-width="3"/><text x="40" y="306" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#0B0B0B" text-anchor="start" font-weight="normal">No write-ahead log to scan — reopening reads two metadata pages and validates a root.</text></svg>