<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Anvil versus bbolt"><rect width="900" height="520" fill="#F2EEE3"/><text x="28" y="38" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#6E6E6E" text-anchor="start" font-weight="normal">HEAD TO HEAD  ·  100k keys, same machine, default durability</text><text x="28" y="74" font-family="'Archivo Black','Arial Black',system-ui,sans-serif" font-size="30" fill="#0B0B0B" text-anchor="start" font-weight="normal">Measured against bbolt</text><rect x="28" y="88" width="844" height="4" fill="#0B0B0B"/><text x="136" y="138" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#0B0B0B" text-anchor="end" font-weight="normal">batched load ↑</text><rect x="154" y="120" width="149" height="18" fill="#0B0B0B"/><rect x="150" y="116" width="149" height="18" fill="#31E1F7" stroke="#0B0B0B" stroke-width="3"/><text x="311" y="130" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="normal">168,315 ops/s</text><rect x="154" y="143" width="400" height="18" fill="#0B0B0B"/><rect x="150" y="139" width="400" height="18" fill="#6E6A60" stroke="#0B0B0B" stroke-width="3"/><text x="562" y="153" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#6E6E6E" text-anchor="start" font-weight="normal">450,584 ops/s  bbolt</text><rect x="740" y="122" width="132" height="26" fill="#E4E0D5" stroke="#0B0B0B" stroke-width="2"/><text x="806" y="140" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="normal">bbolt 2.7x</text><text x="136" y="196" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#0B0B0B" text-anchor="end" font-weight="normal">commit p50 ↓</text><rect x="154" y="178" width="400" height="18" fill="#0B0B0B"/><rect x="150" y="174" width="400" height="18" fill="#31E1F7" stroke="#0B0B0B" stroke-width="3"/><text x="562" y="188" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="normal">1,722 us</text><rect x="154" y="201" width="174" height="18" fill="#0B0B0B"/><rect x="150" y="197" width="174" height="18" fill="#6E6A60" stroke="#0B0B0B" stroke-width="3"/><text x="336" y="211" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#6E6E6E" text-anchor="start" font-weight="normal">750 us  bbolt</text><rect x="740" y="180" width="132" height="26" fill="#E4E0D5" stroke="#0B0B0B" stroke-width="2"/><text x="806" y="198" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="normal">bbolt 2.3x</text><text x="136" y="254" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#0B0B0B" text-anchor="end" font-weight="normal">read p50 ↓</text><rect x="154" y="236" width="400" height="18" fill="#0B0B0B"/><rect x="150" y="232" width="400" height="18" fill="#31E1F7" stroke="#0B0B0B" stroke-width="3"/><text x="562" y="246" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="normal">10.5 us</text><rect x="154" y="259" width="30" height="18" fill="#0B0B0B"/><rect x="150" y="255" width="30" height="18" fill="#6E6A60" stroke="#0B0B0B" stroke-width="3"/><text x="192" y="269" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#6E6E6E" text-anchor="start" font-weight="normal">0.8 us  bbolt</text><rect x="740" y="238" width="132" height="26" fill="#E4E0D5" stroke="#0B0B0B" stroke-width="2"/><text x="806" y="256" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="normal">bbolt 13.1x</text><text x="136" y="312" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#0B0B0B" text-anchor="end" font-weight="normal">full scan ↑</text><rect x="154" y="294" width="46" height="18" fill="#0B0B0B"/><rect x="150" y="290" width="46" height="18" fill="#31E1F7" stroke="#0B0B0B" stroke-width="3"/><text x="208" y="304" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="normal">16.2 M keys/s</text><rect x="154" y="317" width="400" height="18" fill="#0B0B0B"/><rect x="150" y="313" width="400" height="18" fill="#6E6A60" stroke="#0B0B0B" stroke-width="3"/><text x="562" y="327" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#6E6E6E" text-anchor="start" font-weight="normal">138.5 M keys/s  bbolt</text><rect x="740" y="296" width="132" height="26" fill="#E4E0D5" stroke="#0B0B0B" stroke-width="2"/><text x="806" y="314" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="normal">bbolt 8.5x</text><text x="136" y="370" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#0B0B0B" text-anchor="end" font-weight="normal">reopen ↓</text><rect x="154" y="352" width="212" height="18" fill="#0B0B0B"/><rect x="150" y="348" width="212" height="18" fill="#B8FF3C" stroke="#0B0B0B" stroke-width="3"/><text x="374" y="362" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="normal">33.7 us</text><rect x="154" y="375" width="400" height="18" fill="#0B0B0B"/><rect x="150" y="371" width="400" height="18" fill="#6E6A60" stroke="#0B0B0B" stroke-width="3"/><text x="562" y="385" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#6E6E6E" text-anchor="start" font-weight="normal">63.4 us  bbolt</text><rect x="740" y="354" width="132" height="26" fill="#B8FF3C" stroke="#0B0B0B" stroke-width="2"/><text x="806" y="372" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="normal">ANVIL 1.9x</text><text x="136" y="428" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" fill="#0B0B0B" text-anchor="end" font-weight="normal">file size ↓</text><rect x="154" y="410" width="217" height="18" fill="#0B0B0B"/><rect x="150" y="406" width="217" height="18" fill="#B8FF3C" stroke="#0B0B0B" stroke-width="3"/><text x="379" y="420" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="start" font-weight="normal">8.7 MB</text><rect x="154" y="433" width="400" height="18" fill="#0B0B0B"/><rect x="150" y="429" width="400" height="18" fill="#6E6A60" stroke="#0B0B0B" stroke-width="3"/><text x="562" y="443" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#6E6E6E" text-anchor="start" font-weight="normal">16.0 MB  bbolt</text><rect x="740" y="412" width="132" height="26" fill="#B8FF3C" stroke="#0B0B0B" stroke-width="2"/><text x="806" y="430" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#0B0B0B" text-anchor="middle" font-weight="normal">ANVIL 1.8x</text><text x="28" y="476" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" fill="#6E6E6E" text-anchor="start" font-weight="normal">Reads are 13x slower: bbolt memory-maps the file, Anvil preads per page with no cache — a documented</text><text x="28" y="494" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" fill="#6E6E6E" text-anchor="start" font-weight="normal">trade for a simpler crash model. Writes land within 2-3x; Anvil reopens 1.9x faster on a 1.8x smaller file.</text></svg>